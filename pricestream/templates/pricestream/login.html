{% extends "pricestream/base.html" %}
{% block title %}Login — PriceStream{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:4rem auto;">
    <h2>Sign in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Login</button>
    </form>
</div>
{% endblock %}
