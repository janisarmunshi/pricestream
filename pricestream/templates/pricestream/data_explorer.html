{% extends "pricestream/base.html" %}
{% block title %}Data Explorer — PriceStream{% endblock %}
{% block content %}
<h1>Data Explorer</h1>
<div class="card">
    <form id="explorer-form">
        <label>Account:
            <select name="account_id" id="account_id">
                <option value="">—</option>
                {% for account in accounts %}
                <option value="{{ account.id }}">{{ account.nickname }}</option>
                {% endfor %}
            </select>
        </label>
        <input type="text" name="token" id="token" placeholder="Token (optional)">
        <input type="date" name="start" id="start" value="{{ today }}">
        <input type="date" name="end" id="end" value="{{ today }}">
        <button class="btn btn-primary" type="submit">Query</button>
        <a class="btn" id="export-link" href="#" target="_blank" rel="noopener">Export CSV</a>
    </form>
</div>

<table>
    <thead>
        <tr><th>Time</th><th>Account</th><th>Exchange</th><th>Token</th><th>Symbol</th><th>LTP</th><th>Volume</th></tr>
    </thead>
    <tbody id="results-body">
        <tr><td colspan="7">Select an account and query to see ticks.</td></tr>
    </tbody>
</table>
<div class="card" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
    <button class="btn" id="first-btn" type="button" disabled>&laquo; First</button>
    <button class="btn" id="prev-btn" type="button" disabled>&larr; Prev</button>
    <span id="page-info" style="color:#8b949e;font-size:0.85rem;margin:0 0.5rem;"></span>
    <button class="btn" id="next-btn" type="button" disabled>Next &rarr;</button>
    <button class="btn" id="last-btn" type="button" disabled>Last &raquo;</button>
    <span style="margin-left:0.75rem;">
        Go to page: <input type="number" id="jump-page" min="1" style="width:5rem;">
        <button class="btn" id="jump-btn" type="button">Go</button>
    </span>
</div>

<script>
(function () {
    const form = document.getElementById('explorer-form');
    const resultsBody = document.getElementById('results-body');
    const exportLink = document.getElementById('export-link');
    const firstBtn = document.getElementById('first-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const lastBtn = document.getElementById('last-btn');
    const jumpInput = document.getElementById('jump-page');
    const jumpBtn = document.getElementById('jump-btn');
    const pageInfo = document.getElementById('page-info');

    let currentPage = 1;
    let totalPages = 1;

    function buildParams(page) {
        const params = new URLSearchParams();
        const accountId = document.getElementById('account_id').value;
        const token = document.getElementById('token').value;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        if (accountId) params.set('account_id', accountId);
        if (token) params.set('token', token);
        if (start) params.set('start', start + 'T00:00:00Z');
        if (end) params.set('end', end + 'T23:59:59Z');
        if (page) params.set('page', page);
        return params;
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s == null ? '' : s;
        return div.innerHTML;
    }

    function setPagerState() {
        firstBtn.disabled = currentPage <= 1;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
        lastBtn.disabled = currentPage >= totalPages;
        jumpInput.max = totalPages;
    }

    async function fetchPage(page) {
        const params = buildParams(page);
        exportLink.href = '{% url "data_explorer_export" %}?' + buildParams(null).toString();

        if (!params.get('account_id')) {
            resultsBody.innerHTML = '<tr><td colspan="7">Select an account and query to see ticks.</td></tr>';
            currentPage = 1;
            totalPages = 1;
            pageInfo.textContent = '';
            setPagerState();
            return;
        }

        const resp = await fetch('{% url "data_explorer_query" %}?' + params.toString());
        const data = await resp.json();
        currentPage = data.page;
        totalPages = data.total_pages;

        if (!data.results.length) {
            resultsBody.innerHTML = '<tr><td colspan="7">No ticks found for this filter.</td></tr>';
            pageInfo.textContent = 'No results';
            setPagerState();
            return;
        }
        resultsBody.innerHTML = data.results.map(function (t) {
            return '<tr>' +
                '<td>' + escapeHtml(t.time) + '</td>' +
                '<td>' + escapeHtml(t.account_id) + '</td>' +
                '<td>' + escapeHtml(t.exch_seg) + '</td>' +
                '<td>' + escapeHtml(t.token) + '</td>' +
                '<td>' + escapeHtml(t.symbol) + '</td>' +
                '<td>' + escapeHtml(t.ltp) + '</td>' +
                '<td>' + escapeHtml(t.volume) + '</td>' +
                '</tr>';
        }).join('');

        pageInfo.textContent = 'Page ' + data.page + ' of ' + data.total_pages + ' (' + data.total_count + ' rows)';
        jumpInput.value = data.page;
        setPagerState();
    }

    async function runQuery(e) {
        if (e) e.preventDefault();
        await fetchPage(1);
    }

    firstBtn.addEventListener('click', function () { fetchPage(1); });
    prevBtn.addEventListener('click', function () { fetchPage(currentPage - 1); });
    nextBtn.addEventListener('click', function () { fetchPage(currentPage + 1); });
    lastBtn.addEventListener('click', function () { fetchPage(totalPages); });
    jumpBtn.addEventListener('click', function () {
        const target = parseInt(jumpInput.value, 10);
        if (target >= 1) fetchPage(target);
    });
    jumpInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            jumpBtn.click();
        }
    });

    form.addEventListener('submit', runQuery);
    exportLink.addEventListener('click', function (e) {
        if (!buildParams(null).get('account_id')) {
            e.preventDefault();
            alert('Select an account first.');
        }
    });
    // Keep the export link's query string in sync as the user edits filters,
    // without waiting for a Query click.
    form.addEventListener('input', function () {
        exportLink.href = '{% url "data_explorer_export" %}?' + buildParams(null).toString();
    });
    exportLink.href = '{% url "data_explorer_export" %}?' + buildParams(null).toString();
})();
</script>
{% endblock %}
