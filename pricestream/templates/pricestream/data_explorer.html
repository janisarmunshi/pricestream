{% extends "pricestream/base.html" %}
{% block title %}Data Explorer — PriceStream{% endblock %}
{% block content %}
<h1>Data Explorer</h1>
<div class="card">
    <form id="explorer-form">
        <label>Account:
            <select name="account_id" id="account_id">
                <option value="">—</option>
                {% for account in accounts %}
                <option value="{{ account.id }}">{{ account.nickname }}</option>
                {% endfor %}
            </select>
        </label>
        <input type="text" name="token" id="token" placeholder="Token (optional)">
        <input type="date" name="start" id="start" value="{{ today }}">
        <input type="date" name="end" id="end" value="{{ today }}">
        <button class="btn btn-primary" type="submit">Query</button>
        <a class="btn" id="export-link" href="#" target="_blank" rel="noopener">Export CSV</a>
    </form>
</div>

<table>
    <thead>
        <tr><th>Time</th><th>Account</th><th>Exchange</th><th>Token</th><th>Symbol</th><th>LTP</th><th>Volume</th></tr>
    </thead>
    <tbody id="results-body">
        <tr><td colspan="7">Select an account and query to see ticks.</td></tr>
    </tbody>
</table>
<div class="card" style="display:flex;align-items:center;gap:0.75rem;">
    <button class="btn" id="prev-btn" type="button" disabled>&larr; Prev</button>
    <button class="btn" id="next-btn" type="button" disabled>Next &rarr;</button>
    <span id="page-info" style="color:#8b949e;font-size:0.85rem;"></span>
</div>

<script>
(function () {
    const form = document.getElementById('explorer-form');
    const resultsBody = document.getElementById('results-body');
    const exportLink = document.getElementById('export-link');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');

    // Keyset pagination: cursorStack[i] is the "after" cursor that produced the
    // page currently showing at stack depth i (cursorStack[0] is always null, the
    // first page). Prev just pops back to an already-fetched cursor rather than
    // re-deriving a "previous page" server-side, which keyset pagination doesn't
    // support in reverse without a second query direction.
    let cursorStack = [null];
    let pageIndex = 0;
    let nextCursor = null;

    function buildParams(afterCursor) {
        const params = new URLSearchParams();
        const accountId = document.getElementById('account_id').value;
        const token = document.getElementById('token').value;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        if (accountId) params.set('account_id', accountId);
        if (token) params.set('token', token);
        if (start) params.set('start', start + 'T00:00:00Z');
        if (end) params.set('end', end + 'T23:59:59Z');
        if (afterCursor) params.set('after', afterCursor);
        return params;
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s == null ? '' : s;
        return div.innerHTML;
    }

    async function fetchPage(afterCursor) {
        const params = buildParams(afterCursor);
        exportLink.href = '{% url "data_explorer_export" %}?' + buildParams(null).toString();

        if (!params.get('account_id')) {
            resultsBody.innerHTML = '<tr><td colspan="7">Select an account and query to see ticks.</td></tr>';
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '';
            return;
        }

        const resp = await fetch('{% url "data_explorer_query" %}?' + params.toString());
        const data = await resp.json();
        if (!data.results.length) {
            resultsBody.innerHTML = '<tr><td colspan="7">No ticks found for this filter.</td></tr>';
            nextBtn.disabled = true;
            pageInfo.textContent = 'No results';
            return;
        }
        resultsBody.innerHTML = data.results.map(function (t) {
            return '<tr>' +
                '<td>' + escapeHtml(t.time) + '</td>' +
                '<td>' + escapeHtml(t.account_id) + '</td>' +
                '<td>' + escapeHtml(t.exch_seg) + '</td>' +
                '<td>' + escapeHtml(t.token) + '</td>' +
                '<td>' + escapeHtml(t.symbol) + '</td>' +
                '<td>' + escapeHtml(t.ltp) + '</td>' +
                '<td>' + escapeHtml(t.volume) + '</td>' +
                '</tr>';
        }).join('');

        nextCursor = data.next_cursor;
        nextBtn.disabled = !nextCursor;
        prevBtn.disabled = pageIndex === 0;
        pageInfo.textContent = 'Page ' + (pageIndex + 1) + (nextCursor ? '' : ' (last page)');
    }

    async function runQuery(e) {
        if (e) e.preventDefault();
        cursorStack = [null];
        pageIndex = 0;
        await fetchPage(null);
    }

    prevBtn.addEventListener('click', async function () {
        if (pageIndex === 0) return;
        pageIndex -= 1;
        await fetchPage(cursorStack[pageIndex]);
    });

    nextBtn.addEventListener('click', async function () {
        if (!nextCursor) return;
        pageIndex += 1;
        cursorStack[pageIndex] = nextCursor;
        await fetchPage(nextCursor);
    });

    form.addEventListener('submit', runQuery);
    exportLink.addEventListener('click', function (e) {
        if (!buildParams(null).get('account_id')) {
            e.preventDefault();
            alert('Select an account first.');
        }
    });
    // Keep the export link's query string in sync as the user edits filters,
    // without waiting for a Query click.
    form.addEventListener('input', function () {
        exportLink.href = '{% url "data_explorer_export" %}?' + buildParams(null).toString();
    });
    exportLink.href = '{% url "data_explorer_export" %}?' + buildParams(null).toString();
})();
</script>
{% endblock %}
