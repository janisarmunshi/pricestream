# nginx server block for marketmantra.tech. Serves the same static company
# landing page as marketmantra.com at root (this domain used to fall through to
# the marketmantra.com default_server block for its landing page; this restores
# that explicitly since a dedicated server_name block for this domain now exists),
# and proxies PriceStream under the /pricestream path prefix to gunicorn on
# 127.0.0.1:8002 — ports 8000/8001 on this VPS are already used by the authyantra
# and worthwise apps, so 8002 keeps PriceStream from colliding.
#
# TLS is issued by Let's Encrypt via certbot, not a self-signed cert — certbot
# installs its own systemd timer (certbot.timer, already enabled by the certbot
# package) that renews automatically well before the ~90-day expiry, no cron/script
# of our own needed.
#
# Install:
#   sudo cp deploy/pricestream-nginx.conf /etc/nginx/sites-available/marketmantra-tech
#   sudo ln -s /etc/nginx/sites-available/marketmantra-tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d marketmantra.tech   # rewrites the ssl_certificate lines below itself

server {
    listen 80;
    listen [::]:80;
    server_name marketmantra.tech;

    root /var/www/marketmantra;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\.(?!well-known) { deny all; }
    location ^~ /scripts/ { deny all; }

    location /pricestream/static/ {
        alias /opt/pricestream/pricestream/staticfiles/;
    }

    location /pricestream/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pricestream;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
