# nginx server block for marketmantra.tech, serving PriceStream under the
# /pricestream path prefix (not a subdomain), proxying to gunicorn on
# 127.0.0.1:8002 — ports 8000/8001 on this VPS are already used by the
# authyantra and worthwise apps, so 8002 keeps PriceStream from colliding.
# TLS uses a self-signed OpenSSL certificate (no public CA / Let's Encrypt).
#
# Install:
#   sudo cp deploy/pricestream-nginx.conf /etc/nginx/sites-available/marketmantra-tech
#   sudo ln -s /etc/nginx/sites-available/marketmantra-tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name marketmantra.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketmantra.tech;

    ssl_certificate     /etc/ssl/pricestream/marketmantra.tech.crt;
    ssl_certificate_key /etc/ssl/pricestream/marketmantra.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location /pricestream/static/ {
        alias /opt/pricestream/pricestream/staticfiles/;
    }

    location /pricestream/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pricestream;
    }
}
